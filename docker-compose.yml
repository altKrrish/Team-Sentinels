version: '3.8'

services:
  sentinel-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_hardening_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONIOENCODING=utf-8
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
